<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>demo_beast 建模预览</title>
<style>body{background:#1e1e1e;color:#ddd;font-family:sans-serif;padding:16px;max-width:900px;margin:auto}
h1{color:#fff}h2{color:#9ecbff;margin-top:28px;border-bottom:1px solid #444;padding-bottom:4px}
img{max-width:100%;border:1px solid #555;border-radius:6px;margin:6px 0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.gal figure{margin:0;text-align:center}.gal figcaption{font-size:13px;color:#aaa;padding-top:4px}</style></head><body>
<h1>🐾 demo_beast 建模预览</h1>
<p>由 Blockbench 网页版（Termux + chromium + Playwright）驱动生成，全链路在本机完成。</p>
<h2>模型总览（多视图）</h2>
<div class="gal">
<figure><img src="demo_beast_0.png"><figcaption>静态姿势（正视图）</figcaption></figure>
<figure><img src="demo_beast_tex.png"><figcaption>64×64 程序生成纹理</figcaption></figure>
<figure><img src="demo_beast_spawn_egg.png"><figcaption>生成蛋图标 16×16</figcaption></figure>
</div>
<h2>动画（walk 走路）</h2>
<div class="gal">
<figure><img src="demo_beast_0_25_walk.png"><figcaption>t=0.25s 左前腿抬起</figcaption></figure>
<figure><img src="demo_beast_1_walk.png"><figcaption>t=1.0s 换步</figcaption></figure>
<figure><img src="demo_beast_1_75_walk.png"><figcaption>t=1.75s 右前腿抬起</figcaption></figure>
</div>
<h2>动画（idle 呼吸 / tail_wag 摇尾）</h2>
<div class="gal">
<figure><img src="demo_beast_0_375_idle.png"><figcaption>idle t=0.375s</figcaption></figure>
<figure><img src="demo_beast_1_125_idle.png"><figcaption>idle t=1.125s</figcaption></figure>
<figure><img src="demo_beast_0_25_tail_wag.png"><figcaption>tail_wag t=0.25s</figcaption></figure>
<figure><img src="demo_beast_0_75_tail_wag.png"><figcaption>tail_wag t=0.75s</figcaption></figure>
</div>
</body></html>
